<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#061b2b">
<meta name="description" content="Aqua Man — ornamental fish, shrimp, aquatic plants and aquarium supplies.">
<title>Aqua Man | Ornamental Fish & Aquarium Store</title>
<style>
:root{color-scheme:dark;--aqua:#20d4f4;--ink:#061725;--muted:#b8d4df}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 15%,#0d4560 0,#061b2b 48%,#020b14 100%);color:#f4fbff;font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:28px}
main{width:min(100%,760px);text-align:center}.logo{display:block;width:min(100%,590px);height:auto;margin:0 auto 24px;filter:drop-shadow(0 18px 34px #0009)}
h1{font-size:clamp(2rem,6vw,3.5rem);line-height:1.1;margin:0;color:#eafcff;letter-spacing:.06em}p{color:var(--muted);font-size:1.1rem;margin:12px auto;max-width:600px}.tag{color:var(--aqua);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.82rem}
footer{margin-top:34px;color:#7da7b7;font-size:.85rem}
</style>
</head>
<body>
<main>
<img class="logo" src="assets/aqua-man-logo.svg" alt="Aqua Man — Ornamental Fish and Aquarium Store logo">
<div class="tag">Dive into a better aquarium</div>
<h1>AQUA MAN</h1>
<p>Ornamental Fish &amp; Aquarium Store</p>
<p>We’re building a world of beautiful fish, colourful shrimp, aquatic plants and inspiring aquariums. Our online store is coming soon.</p>
<footer>Fish • Shrimp • Aquatic Plants • Aquarium Supplies</footer>
</main>
</body>
</html>
